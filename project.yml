# XcodeGen: `xcodegen generate` writes PiDurable.xcodeproj (git-ignored), plus the Info.plist
# and .entitlements files below (also generated from this file).
name: PiDurable
options:
  bundleIdPrefix: dev.jcdiv47
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: P8FR4R7GEN # free Personal Team
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"

packages:
  PiRuntime:
    path: Packages/PiRuntime
  PiUI:
    path: Packages/PiUI
  PiAppleTools:
    path: Packages/PiAppleTools
  # SSH hosts, over Citadel: the app's only third-party package.
  PiSSH:
    path: Packages/PiSSH

targets:
  PiApp:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # App Intents the widget's and Live Activity's buttons use; compiled into both targets.
      - Shared/Sources
      # Attachments: shared with the share extension.
      - Shared/Attachments
      # The app icon, rendered from App/Icon/pi-logo-color.svg (light, dark and tinted).
      - App/Assets.xcassets
      # Built by the "Bundle JS" phase; optional so a fresh clone can generate the project.
      - path: App/Resources/pi-runtime.js
        optional: true
        buildPhase: resources
      - path: App/Resources/pi-conformance.js
        optional: true
        buildPhase: resources
      # Code Mode's QuickJS sandbox, copied from quickjs-wasi by the same phase; read on the first script.
      - path: App/Resources/quickjs.wasm
        optional: true
        buildPhase: resources
      # Web cards' components and styles (WebCardView injects them into each card's sandboxed web view).
      - path: App/WebUI/pi-ui.js
        buildPhase: resources
      - path: App/WebUI/pi-ui.css
        buildPhase: resources
      # Photo search's MobileCLIP encoders and CLIP tokenizer, from scripts/fetch-mobileclip.sh (not checked in: too
      # big, and under Apple's sample code license). Without them the app downloads them
      # in Settings › Photo Search.
      - path: App/Models
        optional: true
    dependencies:
      - package: PiRuntime
      - package: PiUI
      - package: PiAppleTools
      - package: PiSSH
      - target: PiWidgets
      - target: PiShare
      - sdk: JavaScriptCore.framework
    preBuildScripts:
      - name: Bundle JS
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/js"
          [ -d node_modules ] || bun install --frozen-lockfile
          bun build.ts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jcdiv47.pidurable
        PRODUCT_NAME: PiDurable
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO # "Bundle JS" writes into the source tree
        # The MobileCLIP models are loaded by URL (`ClipModelFiles.bundled`); no generated classes.
        COREML_CODEGEN_LANGUAGE: None
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pi
        UILaunchScreen: {}
        # All four, as iOS asks; PiAppDelegate keeps the app in portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # audio: a voice session (`RealtimeVoice`) keeps listening and talking with the app away or the phone locked.
        UIBackgroundModes: [fetch, processing, audio]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.jcdiv47.pidurable.refresh
          - dev.jcdiv47.pidurable.processing
          - dev.jcdiv47.pidurable.photos
          - dev.jcdiv47.pidurable.run.*
        NSSupportsLiveActivities: true
        # Widget and Live Activity taps: pidurable://conversation/<id>, pidurable://widgets, pidurable://tasks.
        # The share extension: pidurable://share/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jcdiv47.pidurable
            CFBundleURLSchemes: [pidurable]
        NSCalendarsFullAccessUsageDescription: Pi reads your calendar when you ask about your schedule, and adds events you approve.
        NSRemindersFullAccessUsageDescription: Pi reads your reminders when you ask about them, and adds or completes the ones you ask for.
        NSAlarmKitUsageDescription: Pi sets the alarms and timers you ask it for.
        NSHealthShareUsageDescription: Pi reads the health data you ask it about.
        NSLocationWhenInUseUsageDescription: Pi looks up where you are only when a request needs it, such as nearby places or the weather.
        NSHealthUpdateUsageDescription: Pi saves health data only when you ask it to.
        NSPhotoLibraryUsageDescription: Pi searches your photos on this iPhone when you ask it to find one. The photos never leave your iPhone.
        NSCameraUsageDescription: Pi uses the camera only when you take a photo to attach to a message.
        NSMicrophoneUsageDescription: Pi listens only while you dictate a message or talk to Pi, and sends what it hears to OpenAI to turn it into text or answer you. Conversations with Pi are recorded on this iPhone so you can play them back; you can turn that off in Settings.
        # MCP servers in the homelab: plain HTTP to local names and to Tailscale's
        # MagicDNS names, which the tunnel already encrypts. Other API connections still need HTTPS.
        NSAppTransportSecurity:
          # The in-app browser opens arbitrary user-selected pages, including HTTP sites.
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Pi connects to the MCP servers and SSH hosts you add in Settings when they are on your home network.
    entitlements:
      path: App/PiApp.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jcdiv47.pidurable]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        keychain-access-groups: [$(AppIdentifierPrefix)dev.jcdiv47.pidurable.shared]

  PiWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets/Sources, Shared/Sources]
    dependencies:
      - package: PiUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jcdiv47.pidurable.widgets
        PRODUCT_NAME: PiWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pi Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The widget reads native data sources itself, under the app's permissions; it never asks.
        NSCalendarsFullAccessUsageDescription: Pi widgets show your upcoming events.
        NSRemindersFullAccessUsageDescription: Pi widgets show your reminders.
        NSHealthShareUsageDescription: Pi widgets show the health data you put on them.
    entitlements:
      path: Widgets/PiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jcdiv47.pidurable]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  PiShare:
    type: app-extension
    platform: iOS
    sources: [Share/Sources, Shared/Attachments]
    dependencies:
      - package: PiUI
      - sdk: SwiftUI.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jcdiv47.pidurable.share
        PRODUCT_NAME: PiShare
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Pi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: Share/PiShare.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jcdiv47.pidurable]

schemes:
  PiApp:
    build:
      targets:
        PiApp: all
    run:
      config: Debug
